name: Build production artifact

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: datavest-production-artifact
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BETTER_AUTH_URL: http://127.0.0.1:4200
      BETTER_AUTH_SECRET: datavest-build-only-secret-0000000000000000
      DATABASE_URL: postgresql://datavest_build:build_only@127.0.0.1:5432/datavest_build?schema=public
      NEXT_PUBLIC_SITE_URL: https://datavest.vn
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: quant-worker/requirements.txt

      - name: Install application dependencies
        run: |
          npm ci
          npx prisma generate
          python -m pip install -r quant-worker/requirements.txt

      - name: Run repository checks
        run: npm run check

      - name: Build Next.js standalone runtime
        run: npm run build

      - name: Build offline Python wheelhouse
        run: |
          mkdir -p dist/wheelhouse
          python -m pip wheel \
            --wheel-dir dist/wheelhouse \
            -r quant-worker/requirements.txt

      - name: Build offline Prisma migration tooling
        run: |
          PRISMA_VERSION="$(node -p "require('./node_modules/prisma/package.json').version")"
          npm install \
            --prefix dist/migration-tooling \
            --package-lock=false \
            --no-audit \
            --no-fund \
            "prisma@${PRISMA_VERSION}"
          node dist/migration-tooling/node_modules/prisma/build/index.js --version

      - name: Assemble and checksum release
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          export BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          npm run release:assemble
          SHORT_SHA="${GIT_SHA:0:12}"
          ARCHIVE="datavest-release-${SHORT_SHA}.tar.gz"
          tar -C dist -czf "${ARCHIVE}" release
          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"

      - name: Upload checksummed release
        uses: actions/upload-artifact@v4
        with:
          name: datavest-release-${{ github.sha }}
          path: |
            datavest-release-*.tar.gz
            datavest-release-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - name: Download checksummed release
        uses: actions/download-artifact@v4
        with:
          name: datavest-release-${{ github.sha }}
          path: release-artifact

      - name: Verify downloaded artifact
        working-directory: release-artifact
        run: |
          set -Eeuo pipefail
          archive="datavest-release-${GITHUB_SHA:0:12}.tar.gz"
          test -f "${archive}"
          test -f "${archive}.sha256"
          sha256sum -c "${archive}.sha256"

      - name: Transfer and activate release
        env:
          DATAVEST_VPS_HOST: ${{ secrets.DATAVEST_VPS_HOST }}
          DATAVEST_VPS_PORT: ${{ secrets.DATAVEST_VPS_PORT }}
          DATAVEST_VPS_USER: ${{ secrets.DATAVEST_VPS_USER }}
          DATAVEST_VPS_SSH_KEY: ${{ secrets.DATAVEST_VPS_SSH_KEY }}
          DATAVEST_VPS_KNOWN_HOSTS: ${{ secrets.DATAVEST_VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          for name in \
            DATAVEST_VPS_HOST \
            DATAVEST_VPS_PORT \
            DATAVEST_VPS_USER \
            DATAVEST_VPS_SSH_KEY \
            DATAVEST_VPS_KNOWN_HOSTS; do
            test -n "${!name}"
          done
          [[ "${DATAVEST_VPS_PORT}" =~ ^[0-9]{1,5}$ ]]
          [[ "${DATAVEST_VPS_USER}" =~ ^[a-z_][a-z0-9_-]*$ ]]

          key_file="${RUNNER_TEMP}/datavest-deploy-key"
          known_hosts_file="${RUNNER_TEMP}/datavest-known-hosts"
          printf '%s\n' "${DATAVEST_VPS_SSH_KEY}" > "${key_file}"
          printf '%s\n' "${DATAVEST_VPS_KNOWN_HOSTS}" > "${known_hosts_file}"
          chmod 600 "$key_file" "${known_hosts_file}"

          archive="datavest-release-${GITHUB_SHA:0:12}.tar.gz"
          archive_path="release-artifact/${archive}"
          common_ssh_options=(
            -i "${key_file}"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=${known_hosts_file}"
          )
          scp -P "${DATAVEST_VPS_PORT}" "${common_ssh_options[@]}" \
            "${archive_path}" \
            "${archive_path}.sha256" \
            "${DATAVEST_VPS_USER}@${DATAVEST_VPS_HOST}:/opt/datavest/incoming/"
          remote_command="sudo /usr/local/sbin/deploy-datavest '/opt/datavest/incoming/${archive}' '${GITHUB_SHA}'"
          ssh -p "${DATAVEST_VPS_PORT}" "${common_ssh_options[@]}" \
            "${DATAVEST_VPS_USER}@${DATAVEST_VPS_HOST}" \
            "${remote_command}"

      - name: Remove temporary SSH material
        if: ${{ always() }}
        run: |
          rm -f \
            "${RUNNER_TEMP}/datavest-deploy-key" \
            "${RUNNER_TEMP}/datavest-known-hosts"
